[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-dbcore"
version = "0.1.0"
description = "SQLAlchemy database connection wrapper with metadata caching and multi-database support"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Demitri Muna", email = "pypi@nightlightresearch.com"}
]
keywords = ["sqlalchemy", "database", "postgresql", "mysql", "sqlite", "orm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.0"]
mysql = ["pymysql>=1.0.0"]
numpy = ["numpy>=1.20.0"]
astronomy = ["numpy>=1.20.0", "cornish"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "coverage[toml]>=7.0", "black", "flake8"]

[project.urls]
Homepage = "https://github.com/demitri/dm-dbcore"
"Bug Reports" = "https://github.com/demitri/dm-dbcore/issues"
"Source" = "https://github.com/demitri/dm-dbcore"

[tool.setuptools]
packages = [
    "dm_dbcore",
    "dm_dbcore.adapters",
    "dm_dbcore.adapters.postgresql",
    "dm_dbcore.adapters.sqlite",
    "dm_dbcore.mysql",
]

[tool.pytest.ini_options]
minversion = "7.0"
# Only tests/. scripts/ holds `test_dm_dbcore.py`, which is a live-database
# demo, not a pytest suite -- collecting it would be misleading either way.
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgresql: needs a live PostgreSQL server; set DM_DBCORE_TEST_PG_URL to run",
]

[tool.coverage.run]
source = ["dm_dbcore"]
branch = true
# Store repo-relative paths. Coverage data produced in a CI checkout is then
# readable outside it, which the badge step needs.
relative_files = true
# No `omit`. dm_dbcore/adapters/postgresql/numpy_postgresql_psycopg2.py is a
# reference copy of the pre-psycopg3 adapter that nothing imports, so it scores
# zero and drags the total down by roughly seven points. TODO.md says to keep
# the file deliberately, so the honest thing is to keep the number it produces
# too: omitting it would hide unexercised code behind a healthier figure.

[tool.coverage.report]
show_missing = true
skip_covered = false
# No fail_under. A threshold nobody has measured is a guess, and a guessed
# ratchet either blocks honest work or passes vacuously. Set one from a real
# baseline once CI has reported a few runs.
#
# No `exclude_also` either. An earlier draft excluded the optional-dependency
# guards ("except ImportError:", "if not _NUMPY_AVAILABLE:") on the usual
# reasoning that an environment with the package installed cannot take the
# absent-package branch. Measured, that exclusion moved the total from 68% to
# 71% by making 48 statements vanish -- and it was wrong on its own terms: CI
# does NOT install cornish, so the ImportError fallback in ast_pg_geometry.py
# (a block of placeholder classes) really does execute there. Excluding it
# discarded coverage that was actually being achieved, and hid real code that
# nothing had ever checked. Same principle as the `omit` note above: report the
# number the code earns.
